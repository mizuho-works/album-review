<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="アルバム確認">
<title>アルバム確認</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<header class="top">
  <h1>アルバム確認</h1>
  <div class="chips" id="album-chips"></div>
  <div class="confirmed-bar" id="confirmed-bar" hidden>
    <button class="link" id="btn-toggle-confirmed"></button>
  </div>
</header>

<main id="main">
  <p class="empty" id="empty" hidden></p>
  <section id="album" hidden>
    <div class="summary" id="summary"></div>
    <div class="row-actions">
      <button class="btn confirm" id="btn-confirm">✓ 確認済みにする(この端末から消す)</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="pages" class="active">ページ構成</button>
      <button data-tab="photos">写真一覧</button>
    </nav>
    <div id="tab-pages"></div>
    <div id="tab-photos" hidden>
      <div class="filters" id="filters"></div>
      <div class="photo-grid" id="photo-grid"></div>
    </div>
  </section>
</main>

<div class="overlay" id="overlay" hidden>
  <div class="overlay-body" id="overlay-body"></div>
  <button class="overlay-close" id="overlay-close" aria-label="閉じる">✕</button>
</div>
<div class="loadbar" id="loading" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="layouts.js?v=1"></script>
<script src="app.js?v=2"></script>
</body>
</html>
